<style>
:root {
  color-scheme: light;
  --bg: #f7f6f3; --surface: #fcfcfb; --surface-2: #f1f0ec; --line: #e4e2dc; --grid: #ebe9e4;
  --text: #0b0b0b; --text-2: #52514e; --text-3: #7a7974; --accent: #2a78d6;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --muted-mark: #b9b7b0;
  --seq-lo: #eef4fc; --seq-hi: #0d366b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #131312; --surface: #1a1a19; --surface-2: #222220; --line: #33322f; --grid: #2a2a28;
    --text: #f0efec; --text-2: #c3c2b7; --text-3: #8f8e86; --accent: #3987e5;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
    --muted-mark: #55544f;
    --seq-lo: #1f2a38; --seq-hi: #9ec5f4;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #131312; --surface: #1a1a19; --surface-2: #222220; --line: #33322f; --grid: #2a2a28;
  --text: #f0efec; --text-2: #c3c2b7; --text-3: #8f8e86; --accent: #3987e5;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
  --muted-mark: #55544f;
  --seq-lo: #1f2a38; --seq-hi: #9ec5f4;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: var(--accent); }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
header.top { padding: 28px 0 8px; }
.bar { display: flex; justify-content: flex-end; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.toggles { display: inline-flex; gap: 8px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--surface); }
.seg button { border: 0; background: transparent; color: var(--text-2); font: 500 13px/1 Inter, sans-serif; padding: 7px 12px; border-radius: 999px; cursor: pointer; min-height: 30px; }
.seg button[aria-pressed="true"] { background: var(--text); color: var(--surface); }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
h1 { font: 600 clamp(30px, 5vw, 46px)/1.1 "Source Serif 4", Georgia, serif; margin: 0 0 14px; letter-spacing: -.01em; }
.lede { font-size: 17px; color: var(--text-2); max-width: 760px; margin: 0 0 8px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 26px 0 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 14px 12px; }
.tile b { display: block; font: 600 24px/1.1 Inter, sans-serif; font-variant-numeric: tabular-nums; }
.tile span { font-size: 12px; color: var(--text-2); }
details.profile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin: 10px 0 0; }
details.profile > summary, details.tbl > summary { cursor: pointer; padding: 12px 14px; font-weight: 500; font-size: 14px; list-style: none; }
details.profile > summary::-webkit-details-marker, details.tbl > summary::-webkit-details-marker { display: none; }
details.profile > summary::before, details.tbl > summary::before { content: "▸"; display: inline-block; width: 1.1em; color: var(--text-3); transition: transform .15s; }
details[open].profile > summary::before, details[open].tbl > summary::before { transform: rotate(90deg); }
.scroll { overflow-x: auto; padding: 0 14px 14px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; color: var(--text-2); font-size: 12px; }
td.n, th.n { text-align: right; white-space: nowrap; }
code { font: 12px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace; background: var(--surface-2); padding: 1px 5px; border-radius: 5px; word-break: break-all; }
nav.toc { margin: 30px 0 10px; display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 6px 22px; font-size: 13px; }
nav.toc a { color: var(--text-2); text-decoration: none; display: block; padding: 3px 0; }
nav.toc a:hover { color: var(--text); text-decoration: underline; }
nav.toc .p { font-weight: 600; color: var(--text); margin-top: 6px; }
section.part { padding-top: 34px; }
section.part > h2 { font: 600 26px/1.2 "Source Serif 4", Georgia, serif; margin: 0 0 6px; }
section.part > p.pd { color: var(--text-2); margin: 0 0 6px; max-width: 760px; }
figure.chart { margin: 22px 0 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 6px; }
figure.chart h3 { font: 600 19px/1.3 "Source Serif 4", Georgia, serif; margin: 0 0 6px; }
figure.chart h3 .no { color: var(--text-3); font-weight: 500; margin-right: .35em; }
.dek { color: var(--text-2); margin: 0 0 12px; max-width: 820px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--text-2); margin: 0 0 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.legend i.dot { border-radius: 50%; }
.legend i.ring { background: transparent !important; border: 2px solid var(--text-3); border-radius: 50%; }
.legend i.line { height: 2px; width: 14px; border-radius: 1px; vertical-align: 3px; }
.plot { width: 100%; position: relative; }
.plot svg { display: block; width: 100%; height: auto; overflow: visible; }
.axis text, .lbl { fill: var(--text-2); font: 11px Inter, sans-serif; font-variant-numeric: tabular-nums; }
.lbl.strong { fill: var(--text); font-weight: 500; }
.lbl.mut { fill: var(--text-3); }
.axis path { display: none; }
.axis line, .grid line { stroke: var(--grid); }
.base { stroke: var(--text-3); stroke-width: 1; }
.note { font-size: 12px; color: var(--text-3); margin: 10px 0 4px; line-height: 1.5; }
.note b { color: var(--text-2); font-weight: 500; }
details.tbl { border-top: 1px solid var(--line); margin: 10px -18px 0; }
details.tbl > summary { font-size: 12px; color: var(--text-2); padding: 10px 18px; }
details.tbl .scroll { max-height: 360px; overflow: auto; padding: 0 18px 12px; }
.tip { position: fixed; pointer-events: none; z-index: 10; background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12px; line-height: 1.45; box-shadow: 0 6px 24px rgba(0,0,0,.12); max-width: 340px; opacity: 0; transition: opacity .08s; }
.tip b { font-weight: 600; }
.tip .r { display: flex; justify-content: space-between; gap: 14px; }
.tip .r span:last-child { font-variant-numeric: tabular-nums; }
.tip .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
.hit { fill: transparent; cursor: default; }
.mini { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
.mini h4 { margin: 0 0 2px; font: 600 13px/1.3 Inter, sans-serif; }
.mini p { margin: 0 0 6px; font-size: 12px; color: var(--text-2); }
.ptiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 4px 0 14px; }
.ptile { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.ptile .pn { font: 500 12px/1.3 Inter, sans-serif; color: var(--text-2); }
.ptile .pv { font-size: 12px; color: var(--text-2); margin: 2px 0; }
.ptile .pv b { font: 600 22px/1.1 Inter, sans-serif; color: var(--text); font-variant-numeric: tabular-nums; margin-right: 2px; }
.ptile .ps { font-size: 12px; color: var(--text-3); }
.ptile .pbar { display: flex; gap: 2px; height: 6px; margin-top: 8px; border-radius: 3px; overflow: hidden; }
.ptile .pbar i { display: block; }
footer { color: var(--text-3); font-size: 12px; padding: 40px 0 60px; }
@media (max-width: 560px) {
  figure.chart { padding: 14px 12px 4px; border-radius: 12px; }
  details.tbl { margin: 10px -12px 0; }
  details.tbl > summary { padding: 10px 12px; }
  details.tbl .scroll { padding: 0 12px 12px; }
  .lede { font-size: 16px; }
}
@media (forced-colors: active) { .seg button[aria-pressed="true"] { outline: 2px solid CanvasText; } }
</style>

    </span>

const DATA = /*DATA*/null;
</script>
<script>
"use strict";
const D = DATA.charts, PF = DATA.profile;
let LANG = 'cs';
try { const q = new URLSearchParams(location.search).get('lang'); if (q === 'en' || q === 'cs') LANG = q; else { const s = localStorage.getItem('cz-viz-lang'); if (s === 'en' || s === 'cs') LANG = s; } } catch (e) {}
let THEME = 'auto';
try { const t = localStorage.getItem('cz-viz-theme'); if (t === 'light' || t === 'dark') THEME = t; } catch (e) {}

// ------------------------------------------------------------------ strings
const S = {
cs: {
  title: 'České právo ve 20 grafech',
  lede: 'Dvacet grafů nakreslených jen z dat tohoto repozitáře: předpisy Sbírky zákonů a každá jejich změna, Úřední list 1945–1961, Sbírka mezinárodních smluv, sněmovní tisky a hlasování Poslanecké sněmovny, vyhlášky a nařízení obcí a krajů a tabulky čísel, která stanoví právní předpisy.',
  profile_h: 'Profil dat: co bylo použito a jak je to úplné',
  tbl: 'Tabulka s daty', src: 'Zdroj v repozitáři', n: 'Záznamů', cover: 'Rozsah', caveat: 'Omezení',
  ds: 'Datová sada', foot: 'Vytvořeno z repozitáře lexifina/czechia-law ({built}). Čísla počítá skript visualisations/src/prep.py z historie gitu a z tabulek v navrhy/data/ a data/; stránku skládá build.py. Všechny grafy jsou popisné: ukazují, co zdroje zaznamenávají, ne proč.',
  tiles: ['commitů v historii', 'konsolidovaných předpisů v účinnosti', 'návrhů zákonů od roku 1993', 'hlasování Sněmovny', 'hlasů jednotlivých poslanců', 'vyhlášek a nařízení obcí a krajů'],
  year: 'Rok', total: 'Celkem', laws: 'zákonů', days: 'dní', share: 'Podíl', count: 'Počet', of: 'z',
  partial: 'neúplný rok', term: 'Volební období',
  gl: 'Grafy o právu všech zemí z celého global-law: <a href="https://github.com/lexifina/global-law/tree/main/visualisations">global-law visualisations/</a>. Zde jsou jen grafy o Česku.',
},
en: {
  title: 'Czech law in 20 charts',
  lede: 'Twenty charts drawn only from the data in this repository: the acts of the Collection of Laws and every change to them, the Official Journal of 1945–1961, the Collection of International Treaties, the Chamber of Deputies\' prints and votes, the ordinances of municipalities and regions, and tables of the numbers that the law sets.',
  profile_h: 'Data profile: what was used and how complete it is',
  tbl: 'Data table', src: 'Source in the repository', n: 'Records', cover: 'Coverage', caveat: 'Limit',
  ds: 'Dataset', foot: 'Built from the lexifina/czechia-law repository ({built}). The numbers are computed by visualisations/src/prep.py from the git history and the tables in navrhy/data/ and data/; build.py assembles the page. All charts are descriptive: they show what the sources record, not why.',
  tiles: ['commits in the history', 'consolidated acts in force', 'bills since 1993', 'votes of the Chamber', 'individual MPs\' votes', 'ordinances of municipalities and regions'],
  year: 'Year', total: 'Total', laws: 'laws', days: 'days', share: 'Share', count: 'Count', of: 'of',
  partial: 'partial year', term: 'Term',
  gl: 'Charts on every country\'s law, from the whole of global-law: <a href="https://github.com/lexifina/global-law/tree/main/visualisations">global-law visualisations/</a>. These are the charts on Czechia alone.',
}};
const t = k => S[LANG][k];
const L = (cs, en) => LANG === 'cs' ? cs : en;
const fmt = n => (n == null ? '–' : (+n).toLocaleString(LANG === 'cs' ? 'cs-CZ' : 'en-GB'));
const dec = (v, d = 1) => (+v).toFixed(d).replace('.', LANG === 'cs' ? ',' : '.');
const pct = (a, b, d = 0) => b ? dec(100 * a / b, d) + (LANG === 'cs' ? ' %' : '%') : '–';
const MONTHS = { cs: ['led', 'úno', 'bře', 'dub', 'kvě', 'čvn', 'čvc', 'srp', 'zář', 'říj', 'lis', 'pro'], en: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'] };
const MGEN = ['ledna', 'února', 'března', 'dubna', 'května', 'června', 'července', 'srpna', 'září', 'října', 'listopadu', 'prosince'];
const dateTxt = s => { const [y, m, d] = s.split('-').map(Number); return LANG === 'cs' ? `${d}. ${MGEN[m - 1]} ${y}` : `${d} ${MONTHS.en[m - 1]} ${y}`; };
const dateShort = s => { const [y, m, d] = s.split('-').map(Number); return LANG === 'cs' ? `${d}. ${m}. ${y}` : `${d} ${MONTHS.en[m - 1]} ${y}`; };
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const S8 = () => [1, 2, 3, 4, 5, 6, 7, 8].map(i => css('--s' + i));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sum = (a, f) => a.reduce((s, d) => s + (f ? f(d) : d), 0);
const termName = (r) => r.span;

// ------------------------------------------------------------------ tooltip
const tip = document.getElementById('tip');
function showTip(ev, html) { tip.innerHTML = html; tip.style.opacity = 1; moveTip(ev); }
function moveTip(ev) {
  const r = tip.getBoundingClientRect(), pad = 14;
  let x = ev.clientX + pad, y = ev.clientY + pad;
  if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - pad;
  if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - pad;
  tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px';
}
function hideTip() { tip.style.opacity = 0; }
function bindTip(sel, fn) {
  sel.on('mouseenter', (ev, d) => showTip(ev, fn(d))).on('mousemove', moveTip).on('mouseleave', hideTip)
     .on('touchstart', (ev, d) => { const tt = ev.touches[0]; showTip({ clientX: tt.clientX, clientY: tt.clientY }, fn(d)); }, { passive: true });
}
const trow = (sw, k, v) => `<div class="r"><span>${sw ? `<i class="sw" style="background:${sw}"></i>` : ''}${esc(k)}</span><span>${v}</span></div>`;

// ------------------------------------------------------------------ chart scaffolding
function legend(el, items) {
  const lg = el.append('div').attr('class', 'legend');
  items.forEach(it => { const s = lg.append('span'); s.append('i').attr('class', it.shape || '').style('background', it.c); s.append('span').text(it.l); });
}
function svgIn(el, w, h) { return el.append('div').attr('class', 'plot').append('svg').attr('viewBox', `0 0 ${w} ${h}`).attr('width', w).attr('height', h).attr('role', 'img'); }
function table(el, head, rows) {
  const d = el.append('details').attr('class', 'tbl');
  d.append('summary').text(t('tbl'));
  const tb = d.append('div').attr('class', 'scroll').append('table');
  tb.append('thead').append('tr').selectAll('th').data(head).join('th').attr('class', (h, i) => i ? 'n' : null).text(h => h);
  tb.append('tbody').selectAll('tr').data(rows).join('tr').selectAll('td').data(r => r).join('td').attr('class', (v, i) => i ? 'n' : null).text(v => typeof v === 'number' ? fmt(v) : v);
}
function note(el, src, n, extra) {
  const p = el.append('p').attr('class', 'note');
  p.html(`<b>${t('src')}:</b> ${src.map(s => `<code>${esc(s)}</code>`).join(' ')} · <b>${t('n')}:</b> ${n}${extra ? ' · ' + esc(extra) : ''}`);
}
function yAxis(g, y, w, ticks = 5, f = fmt) {
  const ax = g.append('g').attr('class', 'axis grid');
  y.ticks(ticks).forEach(v => {
    ax.append('line').attr('x1', 0).attr('x2', w).attr('y1', y(v)).attr('y2', y(v));
    ax.append('text').attr('x', -6).attr('y', y(v)).attr('dy', '0.32em').attr('text-anchor', 'end').text(f(v));
  });
}
const W = el => Math.max(300, Math.min(1000, el.node().getBoundingClientRect().width || 900));
const narrow = w => w < 560;
function colPath(x, y0, w, y1, r = 4) {
  const h = y0 - y1; if (h <= 0) return '';
  r = Math.min(r, h, w / 2);
  return `M${x},${y0}V${y1 + r}Q${x},${y1} ${x + r},${y1}H${x + w - r}Q${x + w},${y1} ${x + w},${y1 + r}V${y0}Z`;
}
function barPath(x0, y, x1, h, r = 4) {
  const w = x1 - x0; if (w <= 0) return '';
  r = Math.min(r, w, h / 2);
  return `M${x0},${y}H${x1 - r}Q${x1},${y} ${x1},${y + r}V${y + h - r}Q${x1},${y + h} ${x1 - r},${y + h}H${x0}Z`;
}
// stacked columns, keys bottom-up; the top segment gets the rounded end, 1px surface gaps
function stackedColumns(el, rows, keys, colors, names, opt = {}) {
  const w = W(el), h = opt.h || 300, m = { t: 14, r: 8, b: 26, l: 44 };
  const svg = svgIn(el, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
  const iw = w - m.l - m.r, ih = h - m.t - m.b;
  const x = d3.scaleBand().domain(rows.map(r => r.y)).range([0, iw]).padding(opt.pad == null ? 0.25 : opt.pad);
  const tot = r => keys.reduce((s, k) => s + (r[k] || 0), 0);
  const y = d3.scaleLinear().domain([0, opt.max || d3.max(rows, tot)]).nice().range([ih, 0]);
  yAxis(g, y, iw, opt.ticks || 5, opt.yf);
  const bw = Math.min(opt.bw || 24, x.bandwidth());
  rows.forEach(r => {
    let acc = 0; const segs = keys.map((k, i) => ({ k, i, v: r[k] || 0 })).filter(s => s.v > 0);
    const gx = x(r.y) + (x.bandwidth() - bw) / 2;
    segs.forEach((s, j) => {
      const y0 = y(Math.min(acc, y.domain()[1])), y1 = y(Math.min(acc + s.v, y.domain()[1])); acc += s.v;
      const gap = j ? 1 : 0, top = j === segs.length - 1;
      const yy0 = y0 - gap, yy1 = top ? y1 : y1 + 1;
      if (yy0 - yy1 < 0.5) return;
      g.append('path').attr('d', top ? colPath(gx, yy0, bw, yy1) : `M${gx},${yy0}V${yy1}H${gx + bw}V${yy0}Z`).attr('fill', colors[s.i]).attr('opacity', opt.partial && opt.partial(r) ? 0.55 : 1);
    });
    if (opt.topLabel) g.append('text').attr('class', 'lbl').attr('x', gx + bw / 2).attr('y', y(Math.min(tot(r), y.domain()[1])) - 5).attr('text-anchor', 'middle').text(opt.topLabel(r));
  });
  g.append('line').attr('class', 'base').attr('x1', 0).attr('x2', iw).attr('y1', ih).attr('y2', ih);
  const every = opt.every || Math.ceil(rows.length / Math.max(4, Math.floor(iw / 44)));
  rows.forEach((r, i) => { if (i % every === 0 || (i === rows.length - 1 && (rows.length - 1) % every >= every / 2)) g.append('text').attr('class', 'lbl').attr('x', x(r.y) + x.bandwidth() / 2).attr('y', ih + 16).attr('text-anchor', 'middle').text(opt.xf ? opt.xf(r.y) : r.y); });
  bindTip(g.selectAll('.hit').data(rows).join('rect').attr('class', 'hit').attr('x', r => x(r.y)).attr('width', x.bandwidth()).attr('y', 0).attr('height', ih),
    r => `<b>${opt.xf ? opt.xf(r.y) : r.y}${opt.partial && opt.partial(r) ? ' (' + t('partial') + ')' : ''}</b>` + keys.map((k, i) => (r[k] ? trow(colors[i], names[i], fmt(r[k]) + (opt.noShare ? '' : ` · ${pct(r[k], tot(r))}`)) : '')).reverse().join('') + trow(null, t('total'), fmt(tot(r))));
  return { svg, g, x, y, iw, ih, bw };
}

        const w = W(p), h = 250, m = { t: 18, r: 4, b: 24, l: 34 };
        const svg = svgIn(p, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);

        const x = d3.scaleBand().domain(c.map(r => r.t)).range([0, iw]).padding(0.22);
        const y = d3.scaleLinear().domain([0, ymax]).nice().range([ih, 0]);

        g.append('line').attr('class', 'base').attr('x1', 0).attr('x2', iw).attr('y1', ih).attr('y2', ih);

          g.append('text').attr('class', 'lbl').attr('x', x0 + bw / 2).attr('y', ih + 16).attr('text-anchor', 'middle').text(`’${r.t.slice(2)}`);
          bindTip(g.append('rect').attr('class', 'hit').attr('x', x0 - x.step() * x.paddingInner() / 2).attr('width', x.step()).attr('y', 0).attr('height', ih).datum(r),
            d => `<b>${L(...INIT[k])} · ${d.span}${d.t === '2025' ? ' (' + L('probíhá', 'under way') + ')' : ''}</b>` + trow(null, L('Podáno návrhů', 'Bills filed'), fmt(d[k][0])) + trow(ink, L('Staly se zákonem', 'Became law'), fmt(d[k][1])) + trow(null, t('share'), pct(d[k][1], d[k][0])));
        });

      table(el, [t('term'), ...keys.flatMap(k => [L(...INIT[k]) + L(' podáno', ' filed'), L('zákonem', 'law')])], c.map(r => [r.span, ...keys.flatMap(k => r[k])]));

chart('c02', el => {
  const c = D.c02.filter(r => r.n >= 10);
  const BANDS = [[0, 90], [91, 180], [181, 365], [366, 730], [731, 1e9]];
  const BN = [L('do 3 měsíců', 'up to 3 months'), L('3–6 měsíců', '3–6 months'), L('6–12 měsíců', '6–12 months'), L('1–2 roky', '1–2 years'), L('déle než 2 roky', 'over 2 years')];
  const rows = c.map(r => ({ ...r, b: BANDS.map(([a, z]) => r.pts.filter(p => p[0] >= a && p[0] <= z).length) }));
  const full = rows.filter(r => r.t !== '2025');
  const all = BANDS.map((_, i) => sum(full, r => r.b[i])), N = sum(all);
  return {
    title: L('Od předložení do Sbírky: většina zákonů potřebuje tři měsíce až rok', 'From filing to the Collection: most laws take three months to a year'),
    dek: L(`Každý pruh je jedno volební období: jak dlouho trvala cesta zákona od předložení Sněmovně do vyhlášení ve Sbírce zákonů. ${pct(all[1] + all[2], N)} zákonů ji urazilo za 3 až 12 měsíců, ${pct(all[0], N)} rychleji a ${pct(all[3] + all[4], N)} déle než rok. Vpravo je medián.`,
      `Each bar is one term: how long a law took from filing in the Chamber to promulgation in the Collection of Laws. ${pct(all[1] + all[2], N)} of laws took 3 to 12 months, ${pct(all[0], N)} were faster and ${pct(all[3] + all[4], N)} took over a year. The median is on the right.`),
    draw(el) {
      const ramp = d3.interpolateRgb(css('--seq-lo'), css('--seq-hi')), colors = [0.2, 0.4, 0.6, 0.8, 1].map(ramp);
      legend(el, BN.map((l, i) => ({ c: colors[i], l })));
      const w = W(el), nw = narrow(w), rowH = 36, m = { t: 4, r: nw ? 58 : 86, b: 22, l: nw ? 44 : 84 };
      const h = m.t + m.b + rowH * rows.length, svg = svgIn(el, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
      const iw = w - m.l - m.r, x = d3.scaleLinear().domain([0, 1]).range([0, iw]);
      [0, .25, .5, .75, 1].forEach(v => g.append('text').attr('class', 'lbl mut').attr('x', x(v)).attr('y', rowH * rows.length + 14).attr('text-anchor', 'middle').text(pct(v, 1)));
      rows.forEach((r, i) => {
        const y0 = i * rowH + 6, bh = rowH - 12, tot = sum(r.b), id = 'c02c' + i;
        g.append('clipPath').attr('id', id).append('rect').attr('x', 0).attr('y', y0).attr('width', iw).attr('height', bh).attr('rx', bh / 2);
        const row = g.append('g').attr('clip-path', `url(#${id})`).attr('opacity', r.t === '2025' ? .55 : 1);
        let acc = 0;
        r.b.forEach((v, j) => {
          if (!v) return;
          const x0 = x(acc / tot), x1 = x((acc + v) / tot); acc += v;
          row.append('rect').attr('x', x0).attr('width', Math.max(0, x1 - x0 - (j < 4 ? 1.5 : 0))).attr('y', y0).attr('height', bh).attr('fill', colors[j]);
          if (x1 - x0 > 34) row.append('text').attr('class', 'lbl').attr('x', (x0 + x1) / 2).attr('y', y0 + bh / 2 + 4).attr('text-anchor', 'middle')
            .style('fill', j >= 2 ? '#fff' : css('--text')).style('pointer-events', 'none').text(pct(v, tot));
        });
        g.append('text').attr('class', 'lbl strong').attr('x', -10).attr('y', y0 + bh / 2 + 4).attr('text-anchor', 'end').text(nw ? r.t : r.span);
        g.append('text').attr('class', 'lbl strong').attr('x', iw + 10).attr('y', y0 + bh / 2 + 4).text(`${Math.round(r.med)} ${t('days')}`);
        bindTip(g.append('rect').attr('class', 'hit').attr('x', -m.l).attr('width', w).attr('y', i * rowH).attr('height', rowH).datum(r),
          d => `<b>${d.span}${d.t === '2025' ? ' (' + L('probíhá', 'under way') + ')' : ''}</b>` + BN.map((l, j) => trow(colors[j], l, `${fmt(d.b[j])} · ${pct(d.b[j], tot)}`)).join('') +
            trow(null, L('Medián', 'Median'), Math.round(d.med) + ' ' + t('days')) + trow(null, L('Schváleno už v 1. čtení', 'Approved in the 1st reading'), fmt(d.fast)));
      });
      note(el, ['navrhy/data/bills.csv (submitted, became_published)', 'navrhy/data/bill-stages.csv'], fmt(sum(rows, r => r.n)) + ' ' + t('laws'),
        L(`počítá se od předložení tisku do dne vydání částky Sbírky, včetně Senátu, prezidenta a případného vrácení. ${fmt(sum(rows, r => r.fast))} zákonů Sněmovna schválila už v prvním čtení podle § 90 odst. 2 jednacího řádu (v tabulce). Období 2025– teprve začalo (světlejší).`,
          `counted from the filing of the print to the day the Collection issue came out, including the Senate, the President and any return. ${fmt(sum(rows, r => r.fast))} laws were approved by the Chamber in the first reading under § 90(2) of its Rules of Procedure (in the table). The 2025 term has only begun (lighter).`));
      table(el, [t('term'), ...BN, L('Medián (dní)', 'Median (days)'), L('V 1. čtení', 'In 1st reading')], rows.map(r => [r.span, ...r.b, Math.round(r.med), r.fast]));
    }
  };
});

    L('Vrátil → Sněmovna přijala pozměňovací návrhy Senátu', 'Returned → Chamber accepted the Senate\'s amendments'), L('Vrátil → Sněmovna setrvala na svém znění', 'Returned → Chamber kept its own version'),
    L('Vrátil → zákon neprošel', 'Returned → the law failed'), L('Zamítl → Sněmovna ho přehlasovala', 'Rejected → Chamber overrode it'), L('Zamítl → zákon neprošel', 'Rejected → the law failed'), L('Ještě nerozhodnuto / jiné', 'Undecided / other')];
  const T = {}; keys.forEach(k => T[k] = sum(c, r => r[k]));
  const N = sum(keys.slice(0, 7), k => T[k]), ret = T.ret_acc + T.ret_ins + T.ret_fail;
  return {
    title: L('Co dělá Senát se zákony ze Sněmovny: většinu schválí, každý pátý vrátí', 'What the Senate does with the Chamber\'s bills: approves most, returns one in five'),
    dek: L(`Z ${fmt(N)} návrhů zákonů, o kterých Senát rozhodl od roku 1996, jich ${pct(ret, N)} vrátil s pozměňovacími návrhy a ${pct(T.rej_over + T.rej_fail, N)} zamítl. U vrácených zákonů Sněmovna v ${pct(T.ret_acc, ret)} případů přijala senátní znění.`,
      `Of the ${fmt(N)} bills the Senate decided on since 1996, it returned ${pct(ret, N)} with amendments and rejected ${pct(T.rej_over + T.rej_fail, N)}. For the returned bills, the Chamber accepted the Senate's version in ${pct(T.ret_acc, ret)} of cases.`),
    draw(el) {
      legend(el, keys.map((k, i) => ({ c: colors[i], l: names[i] })));
      const w = W(el), nw = narrow(w), rowH = 30, m = { t: 6, r: 52, b: 22, l: nw ? 44 : 80 };
      const h = m.t + m.b + rowH * c.length, svg = svgIn(el, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
      const iw = w - m.l - m.r, x = d3.scaleLinear().domain([0, 1]).range([0, iw]);
      [0, .25, .5, .75, 1].forEach(v => { g.append('line').attr('x1', x(v)).attr('x2', x(v)).attr('y1', 0).attr('y2', rowH * c.length).attr('stroke', css('--grid')); g.append('text').attr('class', 'lbl').attr('x', x(v)).attr('y', rowH * c.length + 14).attr('text-anchor', 'middle').text(pct(v, 1)); });
      c.forEach((r, i) => {
        const tot = sum(keys, k => r[k]), y0 = i * rowH + 5, bh = rowH - 10;
        let acc = 0;
        g.append('text').attr('class', 'lbl strong').attr('x', -8).attr('y', y0 + bh / 2 + 4).attr('text-anchor', 'end').text(nw ? r.t : r.span);
        keys.forEach((k, j) => { if (!r[k]) return; const x0 = x(acc / tot), x1 = x((acc + r[k]) / tot); acc += r[k];
          g.append('rect').attr('x', x0).attr('width', Math.max(0, x1 - x0 - 1)).attr('y', y0).attr('height', bh).attr('fill', colors[j]); });
        g.append('text').attr('class', 'lbl').attr('x', iw + 8).attr('y', y0 + bh / 2 + 4).text(fmt(tot));
        bindTip(g.append('rect').attr('class', 'hit').attr('x', -m.l).attr('width', w).attr('y', i * rowH).attr('height', rowH).datum(r),
          d => `<b>${d.span}</b>` + keys.map((k, j) => d[k] ? trow(colors[j], names[j], `${fmt(d[k])} · ${pct(d[k], tot)}`) : '').join(''));
      });
      note(el, ['navrhy/data/bill-stages.csv', 'navrhy/data/bills.csv'], fmt(sum(c, r => sum(keys, k => r[k]))) + L(' návrhů zákonů doručených Senátu', ' bills delivered to the Senate'),
        L('výsledek je odvozen z kroků tisku na psp.cz (Senát doručen; Sněmovna (Senát) vrácen / zamítnut; Prezident schválen / nezabýval se / pozm. přijat / setrváno). Senát zasedá od prosince 1996.',
          'the outcome is read from the print\'s steps on psp.cz (Senate delivered; Chamber (Senate) returned / rejected; President approved / not dealt with / amendments accepted / insisted). The Senate has sat since December 1996.'));
      table(el, [t('term'), ...names, t('total')], c.map(r => [r.span, ...keys.map(k => r[k]), sum(keys, k => r[k])]));
    }
  };
});

chart('c04', el => {
  const c = D.c04, cols = S8(), pres = ['havel', 'klaus', 'zeman', 'pavel'];
  const OC = { over: [L('Sněmovna veto přehlasovala', 'The Chamber overrode the veto'), cols[0]], kept: [L('Zákon neprošel', 'The law failed'), cols[7]], lapsed: [L('Zaniklo s koncem volebního období', 'Lapsed at the end of the term'), css('--muted-mark')] };
  const SPAN = { havel: ['1993-02-02', '2003-02-02'], klaus: ['2003-03-07', '2013-03-07'], zeman: ['2013-03-08', '2023-03-08'], pavel: ['2023-03-09', PF.built] };
  const st = p => { const v = c.filter(x => x.p === p), yrs = (new Date(SPAN[p][1]) - new Date(SPAN[p][0])) / 31557600000;
    return { n: v.length, over: v.filter(x => x.o === 'over').length, kept: v.filter(x => x.o === 'kept').length, lapsed: v.filter(x => x.o === 'lapsed').length, py: v.length / yrs }; };
  const K = st('klaus'), over = c.filter(v => v.o === 'over').length;
  return {
    title: L(`Prezidentské veto: Václav Klaus vracel ${dec(K.py, 1)} zákona ročně, Sněmovna většinu vet přehlasovala`, `The presidential veto: Václav Klaus returned ${dec(K.py, 1)} laws a year, and the Chamber overrode most vetoes`),
    dek: L(`Každá tečka je jeden zákon, který prezident vrátil Sněmovně (čl. 50 Ústavy), po pololetích. Z ${fmt(c.length)} vet jich Sněmovna přehlasovala ${fmt(over)} (${pct(over, c.length)}). Nejvyšší sloupec je první pololetí 2006, konec volebního období 2002–2006.`,
      `Each dot is one law the President returned to the Chamber (art. 50 of the Constitution), by half-year. Of ${fmt(c.length)} vetoes the Chamber overrode ${fmt(over)} (${pct(over, c.length)}). The tallest column is the first half of 2006, the end of the 2002–2006 term.`),
    draw(el) {
      legend(el, Object.values(OC).map(([l, cc]) => ({ c: cc, l, shape: 'dot' })));
      // one card per president
      const cards = el.append('div').attr('class', 'ptiles');
      pres.forEach(p => {
        const s = st(p), d = cards.append('div').attr('class', 'ptile');
        d.append('div').attr('class', 'pn').text(L(...PRESN[p]));
        d.append('div').attr('class', 'pv').html(`<b>${fmt(s.n)}</b> ${L(s.n === 1 ? 'veto' : s.n < 5 ? 'veta' : 'vet', s.n === 1 ? 'veto' : 'vetoes')}`);
        d.append('div').attr('class', 'ps').text(L(`${dec(s.py, 1)} ročně · přehlasováno ${pct(s.over, s.n)}`, `${dec(s.py, 1)} a year · ${pct(s.over, s.n)} overridden`));
        const bar = d.append('div').attr('class', 'pbar');
        ['over', 'kept', 'lapsed'].forEach(k => { if (s[k]) bar.append('i').style('flex', s[k]).style('background', OC[k][1]); });
      });
      const w = W(el), nw = narrow(w), pd = d3.timeParse('%Y-%m-%d');
      const bins = new Map();
      c.forEach(v => { const dt = pd(v.d), key = dt.getFullYear() + (dt.getMonth() >= 6 ? .5 : 0); if (!bins.has(key)) bins.set(key, []); bins.get(key).push(v); });
      const ORD = { over: 0, kept: 1, lapsed: 2 };
      const maxN = d3.max([...bins.values()], b => b.length), step = nw ? 6 : 8, r = nw ? 2.4 : 3.3;
      const m = { t: 26, r: 8, b: 24, l: 8 }, ih = maxN * step + 6, h = m.t + m.b + ih;
      const svg = svgIn(el, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
      const iw = w - m.l - m.r, x = d3.scaleTime().domain([new Date(1993, 0, 1), new Date(2027, 0, 1)]).range([0, iw]);
      pres.forEach((p, i) => {
        const x0 = x(pd(SPAN[p][0])), x1 = x(pd(SPAN[p][1]));
        if (i % 2 === 0) g.append('rect').attr('x', x0).attr('width', x1 - x0).attr('y', -m.t + 4).attr('height', ih + m.t - 4).attr('rx', 6).attr('fill', css('--surface-2'));
        g.append('text').attr('class', 'lbl strong').attr('x', (x0 + x1) / 2).attr('y', -10).attr('text-anchor', 'middle').text(nw ? L(...PRESN[p]).split(' ')[1] : L(...PRESN[p]));
      });
      x.ticks(nw ? 5 : 10).forEach(v => g.append('text').attr('class', 'lbl').attr('x', x(v)).attr('y', ih + 16).attr('text-anchor', 'middle').text(v.getFullYear()));
      g.append('line').attr('class', 'base').attr('x1', 0).attr('x2', iw).attr('y1', ih).attr('y2', ih);
      const pts = [];
      bins.forEach((vs, key) => {
        const cx = x(new Date(Math.floor(key), key % 1 ? 9 : 3, 1));
        vs.sort((a, b) => ORD[a.o] - ORD[b.o] || a.d.localeCompare(b.d)).forEach((v, k) => pts.push({ v, cx, cy: ih - 4 - k * step }));
      });
      bindTip(g.append('g').selectAll('circle').data(pts).join('circle').attr('cx', p => p.cx).attr('cy', p => p.cy).attr('r', r).attr('fill', p => OC[p.v.o][1]),
        p => `<b>${esc(p.v.title)}</b>` + trow(null, L('Vráceno', 'Returned'), dateTxt(p.v.d)) + trow(null, L('Prezident', 'President'), L(...PRESN[p.v.p])) +
          trow(null, L('Sněmovní tisk', 'Chamber print'), `${p.v.print} (${tn(p.v.term)})`) + trow(OC[p.v.o][1], L('Výsledek', 'Outcome'), OC[p.v.o][0]) + (p.v.became ? trow(null, L('Vyhlášeno jako', 'Promulgated as'), p.v.became) : ''));
      note(el, ['navrhy/data/bill-stages.csv (Sněmovna (Prezident): nepodepsal)'], fmt(c.length) + L(' vet', ' vetoes'),
        L('datum je den kroku „nepodepsal“ v historii tisku; počet za rok je počet vet dělený délkou funkčního období (u Petra Pavla dosud). Ústavní zákony prezident vrátit nemůže; přehlasování vyžaduje 101 hlasů.',
          'the date is that of the "did not sign" step in the print\'s history; vetoes a year divide the count by the time in office (for Petr Pavel so far). The President cannot return constitutional acts; an override needs 101 votes.'));
      table(el, [L('Datum', 'Date'), L('Prezident', 'President'), L('Návrh', 'Bill'), L('Výsledek', 'Outcome')], c.map(v => [v.d, L(...PRESN[v.p]), v.title, OC[v.o][0]]));
    }
  };
});

chart('c05', el => {

      g.append('text').attr('class', 'lbl mut').attr('x', iw).attr('y', rowH * byT.length + 30).attr('text-anchor', 'end').text(L('průměrný Riceův index (1 = úplná jednota)', 'average Rice index (1 = complete unity)'));
      byT.forEach((b, i) => {
        const cy = i * rowH + rowH / 2;
        g.append('line').attr('x1', 0).attr('x2', iw).attr('y1', cy).attr('y2', cy).attr('stroke', css('--grid'));
        g.append('text').attr('class', 'lbl strong').attr('x', -10).attr('y', cy + 4).attr('text-anchor', 'end').text(nw ? b.t : tn(b.t));
        const rows = b.rows.slice().sort((a, z) => z.mps - a.mps);  // bigger lists get the nearer label lanes

        L('kandidátka je ta, za kterou byl poslanec zvolen (elected_for), ne pozdější klub; počítají se jen hlasování v běžném režimu, která nebyla zmatečná, a kandidátky s nejméně pěti hlasujícími pro nebo proti. Zdržení se a nepřítomnost do indexu nevstupují.',

      `Each cell is one hour of the week; the darker, the more votes took place in it since 1993. ${fmt(late)} votes were held after 10 pm or before 6 am; the most after midnight on ${dateTxt(sh[0][0])} (${fmt(sh[0][1])} votes).`),
    draw(el) {

chart('c11', el => {
  const c = D.c11, Y0 = 1990, Y1 = 2026, YRS = d3.range(Y0, Y1 + 1);

    const born = Math.max(Y0, +r.first.slice(0, 4)), end = r.now ? Y1 : +r.days[r.days.length - 1].slice(0, 4);
    return { ...r, by, born, end, peak: d3.max(Object.values(by)) }; });
  const top = rows[0], pk = rows.reduce((a, b) => (a.peak > b.peak ? a : b));
  const pkY = Object.entries(pk.by).find(([, n]) => n === pk.peak)[0];
  return {
    title: L(`Nejčastěji měněné zákony: ${lawName(top.cit).toLowerCase()} se měnil ${top.n}krát`, `The most-changed laws: the ${lawName(top.cit)} changed ${top.n} times`),
    dek: L(`Každý řádek je jeden zákon, každé políčko jeden rok: čím tmavší, tím víckrát v tom roce nabylo účinnosti nové znění. Nejvíc změn za jediný rok má ${lawName(pk.cit, pk.title).toLowerCase()} (${pk.peak} v roce ${pkY}). Šedé řádky jsou zákony, které už neplatí.`,
      `Each row is one law, each cell one year: the darker, the more often a new version took effect that year. The most changes in a single year belong to the ${lawName(pk.cit, pk.title)} (${pk.peak} in ${pkY}). Grey rows are laws no longer in force.`),
    draw(el) {
      const w = W(el), nw = narrow(w), rowH = 21, m = { t: 20, r: nw ? 30 : 64, b: 4, l: nw ? 130 : 270 };
      const iw = w - m.l - m.r, cw = iw / YRS.length, h = m.t + m.b + rowH * rows.length;
      const mx = d3.max(rows, r => r.peak), ramp = d3.interpolateRgb(css('--seq-lo'), css('--seq-hi'));
      const col = n => ramp(0.15 + 0.85 * Math.sqrt(n / mx));
      legend(el, [1, 3, 6, mx].map(n => ({ c: col(n), l: n === mx ? L(`${n} změn za rok`, `${n} changes a year`) : String(n) })).concat([{ c: css('--surface-2'), l: L('rok beze změny', 'a year without change') }]));
      const svg = svgIn(el, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
      YRS.forEach((y, j) => { if (y % (nw ? 10 : 5) === 0) g.append('text').attr('class', 'lbl').attr('x', j * cw + cw / 2).attr('y', -7).attr('text-anchor', 'middle').text(y); });
      const xb = d3.scaleLinear().domain([0, d3.max(rows, r => r.n)]).range([0, m.r - (nw ? 4 : 30)]);
      rows.forEach((r, i) => {
        const cy = i * rowH;
        g.append('text').attr('class', 'lbl strong').attr('x', -8).attr('y', cy + 14).attr('text-anchor', 'end').style('fill', r.now ? null : css('--text-3')).text(lawName(r.cit, r.title));
        YRS.forEach((y, j) => {
          if (y < r.born || y > r.end) return;
          const n = r.by[y] || 0;
          g.append('rect').attr('x', j * cw + 0.75).attr('y', cy + 2).attr('width', Math.max(1, cw - 1.5)).attr('height', rowH - 4).attr('rx', Math.min(3, cw / 3))
            .attr('fill', n ? (r.now ? col(n) : d3.interpolateRgb(css('--surface-2'), css('--text-3'))(0.25 + 0.6 * Math.sqrt(n / mx))) : css('--surface-2'));
        });
        if (!nw) g.append('path').attr('d', barPath(iw + 8, cy + 6, iw + 8 + xb(r.n), rowH - 12, 2)).attr('fill', r.now ? css('--s1') : css('--muted-mark'));
        g.append('text').attr('class', 'lbl').attr('x', iw + (nw ? 4 : 12) + (nw ? 0 : xb(r.n))).attr('y', cy + 14).text(r.n);
        bindTip(g.append('rect').attr('class', 'hit').attr('x', -m.l).attr('width', w).attr('y', cy).attr('height', rowH).datum(r).on('mousemove.y', null),
          d => `<b>${esc(lawName(d.cit, d.title))}</b>` + trow(null, L('Předpis', 'Act'), d.cit) + trow(null, L('Dnů se změnou', 'Days with a change'), fmt(d.n)) +
            trow(null, L('Nejvíc za rok', 'Most in a year'), `${d.peak} (${Object.entries(d.by).find(([, n]) => n === d.peak)[0]})`) + (d.now ? '' : trow(null, L('Stav', 'Status'), L('zrušen', 'repealed'))));
      });
      note(el, ['git log -- sb/<rok>/<číslo>.md'], fmt(sum(rows, r => r.n)) + L(' dnů se změnou', ' days with a change'),
        L('jen zákony (ne vyhlášky). Den, k němuž nabylo účinnosti nové znění, se počítá jednou, i když k němu nabylo účinnosti více novel; číslo vpravo je součet za celou historii, i před rokem 1990, který graf nekreslí.',

      table(el, [L('Zákon', 'Act'), L('Předpis', 'Citation'), ...YRS.map(String), t('total')], rows.map(r => [lawName(r.cit, r.title), r.cit, ...YRS.map(y => r.by[y] || 0), r.n]));

chart('c13', el => {
  const c = D.c13, cols = S8(), top = c.top;
  const big = c.pts.filter(p => p[1] >= 20).length;
  return {
    title: L(`Hromadné novely: jeden zákon změnil až ${top[0].n} dalších předpisů`, `Omnibus amendments: one act changed as many as ${top[0].n} other acts`),
    dek: L(`Každá tečka je jeden zákon, který měnil jiné předpisy: kolik různých předpisů změnil. ${fmt(big)} zákonů změnilo 20 a více předpisů najednou; obvykle jde o doprovodné zákony k velké reformě.`,
      `Each dot is one act that changed other acts: how many different acts it changed. ${fmt(big)} acts changed 20 or more at once; they are usually the accompanying acts of a big reform.`),
    draw(el) {
      const w = W(el), nw = narrow(w), h = 360, m = { t: 14, r: 16, b: 26, l: 40 };
      const svg = svgIn(el, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
      const iw = w - m.l - m.r, ih = h - m.t - m.b;
      const x = d3.scaleLinear().domain([1990, 2027]).range([0, iw]), y = d3.scaleLog().domain([1, 160]).range([ih, 0]);
      [1, 2, 5, 10, 20, 50, 100].forEach(v => { g.append('line').attr('x1', 0).attr('x2', iw).attr('y1', y(v)).attr('y2', y(v)).attr('stroke', css('--grid')); g.append('text').attr('class', 'lbl').attr('x', -6).attr('y', y(v) + 4).attr('text-anchor', 'end').text(v); });
      d3.range(1990, 2030, nw ? 10 : 5).forEach(v => g.append('text').attr('class', 'lbl').attr('x', x(v)).attr('y', ih + 16).attr('text-anchor', 'middle').text(v));
      g.append('line').attr('class', 'base').attr('x1', 0).attr('x2', iw).attr('y1', ih).attr('y2', ih);
      const rnd = d3.randomLcg(42);
      const pts = c.pts.filter(p => p[0] >= 1990).map(p => ({ y: p[0], n: p[1], a: p[2], jx: (rnd() - 0.5) * 0.8, jy: 1 + (rnd() - 0.5) * 0.25 }));
      bindTip(g.append('g').selectAll('circle').data(pts).join('circle').attr('cx', p => x(p.y + 0.5 + p.jx)).attr('cy', p => y(Math.max(1, p.n * (p.n < 4 ? p.jy : 1)))).attr('r', p => p.n >= 20 ? 3.6 : 2.2)
        .attr('fill', p => p.n >= 20 ? cols[1] : cols[0]).attr('opacity', p => p.n >= 20 ? .9 : .25),
        p => `<b>${L('Zákon č.', 'Act No.')} ${esc(p.a)}</b>` + (OMNI[p.a] ? trow(null, '', L(...OMNI[p.a])) : '') + trow(null, L('Změnil předpisů', 'Acts changed'), fmt(p.n)));
      const placed = [];
      top.slice(0, nw ? 4 : 8).forEach(tp => {
        const cit = tp.a.replace('Zákon č. ', ''), p = pts.find(q => q.a === cit); if (!p) return;
        const xx = x(p.y + 0.5 + p.jx), yy = y(p.n), txt = `${cit}: ${OMNI[cit] ? L(...OMNI[cit]) : ''}`, tw = txt.length * 5.6;
        for (const [lx, ly, an] of [[xx + 7, yy + 4, 'start'], [xx - 7, yy + 4, 'end'], [xx + 7, yy + 16, 'start'], [xx - 7, yy + 16, 'end'], [xx + 7, yy - 8, 'start'], [xx - 7, yy - 8, 'end']]) {
          const x0 = an === 'start' ? lx : lx - tw, box = [x0, ly - 10, x0 + tw, ly + 3];
          if (x0 < 0 || x0 + tw > iw) continue;
          if (placed.some(b => !(box[2] < b[0] || box[0] > b[2] || box[3] < b[1] || box[1] > b[3]))) continue;
          placed.push(box); g.append('text').attr('class', 'lbl strong').attr('x', lx).attr('y', ly).attr('text-anchor', an).text(txt); break;
        }
      });
      note(el, ['git log -- sb/ (autor = novelizující zákon, změněné soubory)'], fmt(c.pts.length) + L(' novelizujících zákonů', ' amending acts'),
        L('počítají se různé předpisy, jejichž text zákon změnil (bez sebe sama), za celou dobu; logaritmická osa. Rok je rok vyhlášení novelizujícího zákona.', 'counts the different acts whose text the act changed (not itself), over all time; log scale. The year is the year the amending act was promulgated.'));
      table(el, [L('Zákon', 'Act'), L('Změněných předpisů', 'Acts changed'), L('Název', 'Title')], top.map(x => [x.a, x.n, x.title]));
    }
  };
});

    draw(el) {

      const pe = box.append('div'), pw = box.append('div');
      pe.append('h4').text(L('Evropa', 'Europe')); pw.append('h4').text(L('Svět', 'World'));

      const map = (div, mk, hh) => {
        const w = W(div), h = Math.round(w * hh), svg = svgIn(div, w, h).style('overflow', 'hidden');
        draws.push(() => {

        });

      map(pe, (w, h) => d3.geoConicConformal().parallels([40, 62]).rotate([-14, 0]).fitExtent([[0, 0], [w, h]], eu), 0.78);
      map(pw, (w, h) => d3.geoNaturalEarth1().fitExtent([[0, 0], [w, h]], { type: 'Sphere' }), 0.52);
      const fail = () => box.append('p').attr('class', 'note').text(L('Mapu se nepodařilo načíst (cdn.jsdelivr.net); čísla jsou v grafu níže a v tabulce.', 'The map could not be loaded (cdn.jsdelivr.net); the numbers are in the chart below and the table.'));
      if (WORLD) draws.forEach(f => f()); else worldAtlas().then(() => draws.forEach(f => f())).catch(fail);

function fitLeftLabels(fig) {
  fig.selectAll('svg text').each(function () {
    if (this.getAttribute('text-anchor') !== 'end' || !(+this.getAttribute('x') < 0)) return;
    const svg = this.ownerSVGElement, room = this.getBoundingClientRect().right - svg.getBoundingClientRect().left - 2;
    if (this.getComputedTextLength() <= room) return;
    const full = this.textContent;
    d3.select(this).append('title').text(full);
    let lo = 0, hi = full.length;
    while (lo < hi) { const mid = (lo + hi + 1) >> 1; this.firstChild.nodeValue = full.slice(0, mid) + '…'; if (this.getComputedTextLength() <= room) lo = mid; else hi = mid - 1; }
    this.firstChild.nodeValue = full.slice(0, lo) + '…';
  });
}
function render() {
  document.documentElement.lang = LANG === 'cs' ? 'cs' : 'en';
  document.title = t('title');
  d3.selectAll('[data-i]').each(function () { this.textContent = t(this.dataset.i); });
  document.getElementById('gl-link').innerHTML = t('gl');
  d3.selectAll('[data-lang]').attr('aria-pressed', function () { return String(this.dataset.lang === LANG); });
  d3.selectAll('[data-theme-set]').attr('aria-pressed', function () { return String(this.dataset.themeSet === THEME); });
  const tl = t('tiles'), tv = [PF.commits, PF.sb_consolidated_now, PF.bills, PF.votes, PF.mp_votes, PF.local];
  d3.select('#tiles').html('').selectAll('div').data(tv).join('div').attr('class', 'tile').html((v, i) => `<b>${fmt(v)}</b><span>${tl[i]}</span>`);
  profileTable();
  const main = d3.select('#main').html(''), toc = d3.select('#toc').html('');
  let sec = null, n = 0;
  CH.forEach(c => {
    if (c.part) {
      sec = main.append('section').attr('class', 'part').attr('id', c.id);
      sec.append('h2').text(L(c.cs, c.en)); sec.append('p').attr('class', 'pd').text(L(c.dcs, c.den));
      toc.append('a').attr('class', 'p').attr('href', '#' + c.id).text(L(c.cs, c.en));
      return;
    }
    n++;
    const fig = sec.append('figure').attr('class', 'chart').attr('id', c.id);
    const spec = c.fn(fig);
    const h3 = fig.append('h3'); h3.append('span').attr('class', 'no').text(n + '.'); h3.append('span').text(spec.title);
    fig.append('p').attr('class', 'dek').text(spec.dek);
    try { spec.draw(fig); } catch (e) { fig.append('p').attr('class', 'note').text('Error: ' + e.message); console.error(c.id, e); }
    fitLeftLabels(fig);
    fig.select('svg').attr('aria-label', spec.title);
    toc.append('a').attr('href', '#' + c.id).text(`${n}. ${spec.title.split(':')[0]}`);
  });
  d3.select('#foot').text(t('foot').replace('{built}', PF.built + (PF.head ? ', ' + PF.head.slice(0, 10) : '')));
}
d3.selectAll('[data-lang]').on('click', function () { LANG = this.dataset.lang; try { localStorage.setItem('cz-viz-lang', LANG); } catch (e) {} render(); });
d3.selectAll('[data-theme-set]').on('click', function () {
  THEME = this.dataset.themeSet;
  if (THEME === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', THEME);
  try { localStorage.setItem('cz-viz-theme', THEME); } catch (e) {}
  render();
});
if (THEME !== 'auto') document.documentElement.setAttribute('data-theme', THEME);
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (THEME === 'auto') render(); }); } catch (e) {}
let lastW = innerWidth, rt;
addEventListener('resize', () => { if (Math.abs(innerWidth - lastW) < 40) return; clearTimeout(rt); rt = setTimeout(() => { lastW = innerWidth; const y = scrollY; render(); scrollTo(0, y); }, 200); });
render();
</script>
